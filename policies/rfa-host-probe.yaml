# 검증 전용. curl 로 "읽기는 통과, 결재는 차단"을 재현할 때만 적용하고 끝나면 제거한다.
#   nemoclaw public policy remove rfa-host-probe --yes
# 운영 정책(rfa-host-services)은 python 만 허용하므로, 이 파일 없이는 curl 요청이 전부 막힌다.

preset:
  name: rfa-host-probe
  description: "Verification-only curl access to RFA host services (remove after use)"

network_policies:
  rfa_probe:
    name: rfa_probe
    endpoints:
      - host: __RFA_HOST_IP__
        port: 8790
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/reviews" }
        deny_rules:
          - { method: "*", path: "/reviews/*/approve" }
          - { method: "*", path: "/reviews/*/reject" }
      - host: __RFA_HOST_IP__
        port: 8791
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/tasks" }
    binaries:
      - { path: /usr/bin/curl }
